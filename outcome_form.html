<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיכום פגישה - אקדמיית הדולר</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #001a4d 0%, #0033cc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 26, 77, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: white;
            border-bottom: 3px solid #000;
            padding: 24px;
            text-align: center;
        }
        .logo { width: 60px; height: auto; margin: 0 auto 12px; }
        .logo svg { width: 100%; height: auto; }
        .header-title { font-size: 18px; font-weight: 600; color: #000; margin-bottom: 4px; }
        .header-subtitle { font-size: 13px; color: #666; }
        .form-content { padding: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group:last-child { margin-bottom: 0; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .required { color: #ff4444; }
        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 0.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #0033cc;
            box-shadow: 0 0 0 3px rgba(0, 51, 204, 0.1);
        }
        input[readonly] { background: #f5f5f5; cursor: not-allowed; }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        .radio-group { display: flex; flex-direction: column; gap: 10px; }
        .radio-option {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .radio-option:hover { background: #f5f5f5; }
        input[type="radio"] {
            margin-left: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0033cc;
        }
        .option-label { cursor: pointer; font-size: 14px; color: #333; flex: 1; }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }
        .submit-btn {
            background: linear-gradient(135deg, #001a4d 0%, #0033cc 100%);
            color: white;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 51, 204, 0.3); }
        .reset-btn { background: #f0f0f0; color: #333; }
        .reset-btn:hover { background: #e0e0e0; }
        .success-message { display: none; background: #e8f5e9; border: 2px solid #4caf50; color: #2e7d32; padding: 16px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .error-message { display: none; background: #ffebee; border: 2px solid #f44336; color: #c62828; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
        .loading { display: none; text-align: center; padding: 20px; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0033cc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 20 15 L 50 15 Q 70 15 70 50 Q 70 85 50 85 L 20 85 Z" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M 30 30 L 50 30 Q 60 30 60 50 Q 60 70 50 70 L 30 70 Z" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="header-title">סיכום פגישה</div>
            <div class="header-subtitle">אקדמיית הדולר</div>
        </div>

        <div class="form-content">
            <div class="success-message" id="successMsg">✅ סיכום הפגישה נשלח! הסוכן שלנו כבר מנתח את השיחה...</div>
            <div class="error-message" id="errorMsg"></div>

            <form id="outcomeForm">
                <!-- Client Name -->
                <div class="form-group">
                    <label for="clientName">לקוח <span class="required">*</span></label>
                    <input type="text" id="clientName" name="clientName" readonly>
                </div>

                <!-- Date -->
                <div class="form-group">
                    <label for="callDate">תאריך <span class="required">*</span></label>
                    <input type="date" id="callDate" name="callDate" readonly>
                </div>

                <!-- Outcome -->
                <div class="form-group">
                    <label>תוצאה <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <label class="option-label">
                                <input type="radio" name="outcome" value="closed_positive" required>
                                ✅ נסלק
                            </label>
                        </div>
                        <div class="radio-option">
                            <label class="option-label">
                                <input type="radio" name="outcome" value="follow_needed" required>
                                📞 פולואפ
                            </label>
                        </div>
                        <div class="radio-option">
                            <label class="option-label">
                                <input type="radio" name="outcome" value="not_interested" required>
                                ❌ לא מעוניין
                            </label>
                        </div>
                        <div class="radio-option">
                            <label class="option-label">
                                <input type="radio" name="outcome" value="not_suitable" required>
                                🚫 לא מתאים
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Notes -->
                <div class="form-group">
                    <label for="notes">הערות (אופציונלי)</label>
                    <textarea id="notes" name="notes" placeholder="משהו שחשוב לך להוסיף..."></textarea>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="submit" class="submit-btn">שלח</button>
                    <button type="reset" class="reset-btn">נקה</button>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>שולח...</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('clientName').value = decodeURIComponent(params.get('client') || '');
        const dateStr = params.get('date');
        if (dateStr) document.getElementById('callDate').value = dateStr;

        document.getElementById('outcomeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                clientName: document.getElementById('clientName').value,
                callDate: document.getElementById('callDate').value,
                outcome: document.querySelector('input[name="outcome"]:checked').value,
                notes: document.getElementById('notes').value,
                submittedAt: new Date().toISOString()
            };

            document.getElementById('loading').style.display = 'block';
            document.querySelector('.submit-btn').disabled = true;

            try {
                const response = await fetch('/api/submit_outcome', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    document.getElementById('successMsg').style.display = 'block';
                    document.getElementById('errorMsg').style.display = 'none';
                    document.getElementById('outcomeForm').reset();
                    setTimeout(() => window.close(), 2000);
                } else {
                    throw new Error('שגיאה בשליחת הדוח');
                }
            } catch (error) {
                document.getElementById('errorMsg').textContent = '❌ ' + error.message;
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
                document.querySelector('.submit-btn').disabled = false;
            }
        });
    </script>
</body>
</html>
